services:
  - type: web
    name: bis-agentic-rag
    env: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.6-flash
      - key: EMBEDDING_PROVIDER
        value: MistralAIEmbeddings
      - key: EMBEDDING_MODEL
        value: mistral-embed-2312
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
